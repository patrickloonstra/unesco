<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Werelderfgoed</title>
  <meta name="description" content="Houd bij welke UNESCO-werelderfgoedlocaties je hebt bezocht, waar je nog heen wilt en wat er in de buurt is.">
  <meta name="theme-color" content="#092328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Erfgoed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Werelderfgoed</h1>
    <div class="progress" id="progress" aria-live="polite"></div>
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="layout">
    <div id="map" class="map" aria-label="Kaart met werelderfgoedlocaties"></div>

    <section class="sheet" id="sheet">
      <button class="sheet-handle" id="sheet-handle" aria-label="Lijst groter of kleiner maken"><span></span></button>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="nearby">In de buurt</button>
        <button role="tab" data-tab="want">Wil ik heen <span class="count" data-count="want"></span></button>
        <button role="tab" data-tab="visited">Bezocht <span class="count" data-count="visited"></span></button>
        <button role="tab" data-tab="all">Alle</button>
      </nav>

      <div class="nearby-controls" id="nearby-controls" hidden>
        <div class="origin-row">
          <button class="chip" id="gps-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Mijn locatie
          </button>
          <button class="chip" id="pick-btn">Kies op kaart</button>
        </div>
        <form class="place-form" id="place-form">
          <input type="search" id="place-input" placeholder="Zoek een plaats, bijv. Lissabon" autocomplete="off" enterkeyhint="search">
          <button type="submit" class="chip">Zoek</button>
        </form>
        <ul class="place-results" id="place-results" hidden></ul>
        <div class="origin-label" id="origin-label"></div>
        <label class="radius">
          <span>Straal <strong id="radius-value"></strong></span>
          <input type="range" id="radius" min="0" max="10" step="1">
        </label>
      </div>

      <div class="search-row" id="search-row">
        <input type="search" id="search" placeholder="Zoek op naam of land" autocomplete="off">
      </div>

      <p class="list-meta" id="list-meta"></p>
      <ul class="site-list" id="site-list"></ul>

      <article class="detail" id="detail" hidden></article>
    </section>
  </main>

  <dialog id="menu">
    <form method="dialog" class="menu-inner">
      <h2>Je gegevens</h2>
      <p>Je lijsten worden alleen in deze browser bewaard. Maak af en toe een back-up, of zet ze zo over naar een ander apparaat.</p>
      <button type="button" class="btn" id="export-btn">Exporteer back-up</button>
      <label class="btn btn-secondary">
        Importeer back-up
        <input type="file" id="import-input" accept="application/json,.json" hidden>
      </label>
      <p class="menu-status" id="menu-status" role="status"></p>
      <p class="small">Bron: UNESCO-werelderfgoedlijst, <span id="data-info"></span>. Kaart: © OpenStreetMap, © CARTO.</p>
      <button class="btn btn-secondary" value="close">Sluiten</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
